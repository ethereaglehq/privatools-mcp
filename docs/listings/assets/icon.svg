<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PrivaTools MCP Server Icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2129"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    <radialGradient id="glow" cx="44%" cy="40%" r="54%">
      <stop offset="0%" stop-color="#91B2FA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#91B2FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#B3CCFF"/>
      <stop offset="55%" stop-color="#91B2FA"/>
      <stop offset="100%" stop-color="#6F95F2"/>
    </linearGradient>
    <linearGradient id="mcpAccent" x1="48" y1="54" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7EE7C8"/>
      <stop offset="100%" stop-color="#91B2FA"/>
    </linearGradient>
  </defs>

  <!-- Rounded obsidian app tile -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Official PrivaTools geometric P ribbon mark -->
  <g transform="translate(94 82) scale(5.9)">
    <path fill="url(#markGrad)" d="M1 7C1 3.7 3.7 1 7 1H26C38.2 1 47 9.4 47 20.8C47 32.2 38.2 40 26.2 40H17V35.7C17 31.1 20.3 28.8 24.8 28.8H27C30.6 28.8 32 26.5 32 23.3V18.6C32 15.4 30 14 26.8 14H15.7L1 7Z"/>
    <path fill="url(#markGrad)" d="M1 9.3L14.7 16.8V43.6C14.7 46 13.6 47.7 11.5 48.9L3.6 53.4C2.2 54.2 1 53.5 1 51.9V9.3Z"/>
  </g>

  <!-- MCP Protocol Node Hub Badge (bottom-right) -->
  <g transform="translate(302 302)">
    <rect x="0" y="0" width="154" height="154" rx="42" fill="#171A21" stroke="#91B2FA" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="48" y1="54" x2="77" y2="106" stroke="url(#mcpAccent)" stroke-width="9" stroke-linecap="round"/>
    <line x1="106" y1="54" x2="77" y2="106" stroke="url(#mcpAccent)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="48" cy="54" r="15" fill="#91B2FA"/>
    <circle cx="106" cy="54" r="15" fill="#7EE7C8"/>
    <circle cx="77" cy="106" r="15" fill="#E6EEFF"/>
    <circle cx="48" cy="54" r="5.5" fill="#171A21"/>
    <circle cx="106" cy="54" r="5.5" fill="#171A21"/>
    <circle cx="77" cy="106" r="5.5" fill="#171A21"/>
  </g>
</svg>
